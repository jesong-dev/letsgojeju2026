<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060811">
  <meta name="description" content="Y리조트 제주에서 함께하는 2026년 10월 4일부터 6일까지의 여행">
  <title>Y리조트 제주 · 우리 함께</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e17;
      --bg-deep: #060811;
      --card: #17140f;
      --card-edge: #3a2f1c;
      --cream: #f3eee2;
      --accent: #e9a06e;
      --lavender: #b9a3d8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg-deep);
    }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--cream);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 10% 15%, rgba(255,255,255,.45) 0 1px, transparent 1.5px),
        radial-gradient(circle at 60% 10%, rgba(255,255,255,.4) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.3) 0 1px, transparent 1.5px),
        radial-gradient(circle at 45% 70%, rgba(255,255,255,.25) 0 1px, transparent 1.5px),
        linear-gradient(180deg, var(--bg-deep), var(--bg) 42%, var(--bg));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      position: relative;
      width: min(100%, 520px);
      margin-inline: auto;
      padding:
        max(36px, env(safe-area-inset-top))
        20px
        max(32px, env(safe-area-inset-bottom));
    }

    .flight-path {
      position: absolute;
      inset: 0 20px auto;
      height: 48px;
      overflow: hidden;
      pointer-events: none;
    }

    .plane {
      position: absolute;
      top: 8px;
      left: 0;
      width: 28px;
      height: 28px;
      color: var(--lavender);
      opacity: .72;
      animation: fly 16s ease-in-out infinite alternate;
    }

    @keyframes fly {
      from { transform: translateX(0) translateY(8px) rotate(-8deg); }
      to { transform: translateX(calc(min(100vw, 520px) - 68px)) translateY(-6px) rotate(8deg); }
    }

    .stay-card {
      position: relative;
      margin-top: 40px;
      overflow: hidden;
      border: 1px solid var(--card-edge);
      border-radius: 18px;
      aspect-ratio: 5 / 4;
      background: var(--card);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .34);
    }

    .stay-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stay-card figcaption {
      position: absolute;
      inset: auto 0 0;
      padding: 42px 20px 17px;
      color: var(--cream);
      font-family: Georgia, "Noto Serif KR", serif;
      font-size: clamp(18px, 5vw, 21px);
      font-weight: 700;
      letter-spacing: .02em;
      background: linear-gradient(to top, rgba(6, 8, 17, .9), transparent);
    }

    footer {
      margin-top: 30px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-align: center;
    }

    @media (max-width: 380px) {
      main { padding-inline: 14px; }
      .flight-path { inset-inline: 14px; }
      .stay-card { border-radius: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .plane {
        animation: none;
        transform: translateY(4px) rotate(-8deg);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="flight-path" aria-hidden="true">
      <svg class="plane" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 3 3 10.5l8 3 3 7.5L21 3Z"/>
        <path d="m21 3-10 10.5"/>
      </svg>
    </div>

    <figure class="stay-card">
      <picture>
        <source srcset="jejuhomeimg.webp" type="image/webp">
        <img src="jejuhomeimg.png" width="1400" height="1120"
          alt="산과 바다가 보이는 Y리조트 제주, 조식과 월풀 욕조가 포함된 2박 3일 숙소"
          fetchpriority="high" decoding="async">
      </picture>
      <figcaption>
        <time datetime="2026-10-04">2026.10.04</time>–<time datetime="2026-10-06">10.06</time>
      </figcaption>
    </figure>

    <footer>Y RESORT JEJU · 숙소 결정</footer>
  </main>
</body>
</html>
