<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>떠나요 둘이서 · 제주 2026 — Typography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f2ed; --ink:#121212; --muted:#77756c; --accent:#3241c4;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; }
  .wrap{ max-width:600px; margin:0 auto; padding:70px 22px 60px; }

  [data-reveal]{ opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s ease; }
  [data-reveal].in{ opacity:1; transform:translateY(0); }

  .eyebrow{ font-size:12.5px; letter-spacing:.2em; color:var(--muted); margin-bottom:18px; }
  h1{
    font-family:'Black Han Sans',sans-serif; font-weight:400;
    font-size:clamp(38px,12vw,64px); line-height:1.15; margin:0 0 30px;
  }
  h1 .accent{ color:var(--accent); }

  .route{
    font-family:'Black Han Sans',sans-serif; font-size:clamp(30px,9vw,46px);
    margin:50px 0 6px;
  }
  .route .arrow{ color:var(--accent); }
  .sub{ color:var(--muted); font-size:14px; line-height:1.75; max-width:420px; margin-top:14px; }

  h2{
    font-family:'Black Han Sans',sans-serif; font-weight:400;
    font-size:clamp(26px,7vw,36px); line-height:1.3; margin:70px 0 26px;
  }

  .date-big{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:20px 0; border-bottom:2px solid #ddd9cd; cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .date-big .range{ font-size:clamp(22px,6.5vw,30px); font-weight:700; color:var(--ink); }
  .date-big .days{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .date-big.selected .range{ color:var(--accent); text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:6px; }

  .field{ margin-top:60px; }
  .field label{ font-family:'Black Han Sans',sans-serif; font-size:22px; display:block; margin-bottom:12px; }
  .field input{
    width:100%; border:none; border-bottom:3px solid var(--ink); background:transparent;
    padding:10px 2px; font-size:20px; outline:none; font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  }
  .field input:focus{ border-color:var(--accent); }

  .submit-btn{
    margin-top:28px; background:none; border:none; padding:0; cursor:pointer;
    font-family:'Black Han Sans',sans-serif; font-size:28px; color:var(--ink);
    display:inline-flex; align-items:center; gap:10px;
  }
  .submit-btn .arrow{ color:var(--accent); transition:transform .2s ease; }
  .submit-btn:not(:disabled):hover .arrow{ transform:translateX(6px); }
  .submit-btn:disabled{ color:#bab6a8; cursor:not-allowed; }
  .submit-btn:disabled .arrow{ color:#bab6a8; }
  .hint{ font-size:12px; color:var(--muted); margin-top:10px; }
  .status{ font-size:13px; margin-top:10px; min-height:16px; }
  .status.ok{ color:#2f7a4f; } .status.err{ color:#c0472e; }

  .m-row{ display:flex; justify-content:space-between; align-items:baseline; padding:14px 0; border-bottom:1px solid #ddd9cd; }
  .m-row .n{ font-size:17px; font-weight:700; }
  .m-row .d{ font-size:12px; color:var(--muted); }
  .empty{ color:var(--muted); font-size:14px; padding:16px 0; }
  .warn{ font-size:12px; color:#a4432b; background:#f4e2dc; padding:10px 14px; margin-bottom:20px; }
  .warn{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="warn" id="configWarning">Firebase 설정이 비어 있습니다. 화면 확인은 가능하나 저장은 되지 않습니다.</div>

  <div class="eyebrow" data-reveal>떠나요 · 둘이서 · 2026</div>
  <h1 data-reveal>일상은 잠시<br>접어두고,<br><span class="accent">제주로.</span></h1>
  <p class="sub" data-reveal>가끔은 계획 없이 걷고, 먹고, 바다를 보는 것만으로 충분한 여정이 있습니다.</p>

  <div class="route" data-reveal>SEL <span class="arrow">→</span> CJU</div>
  <p class="sub" data-reveal>이 초대장을 받으신 분께는 앞으로 몇 번 정도 질문을 드릴 예정이에요. 부담 갖지 마시고 편하게 답해주시면 돼요.</p>

  <h2 data-reveal>2박 3일,<br>언제가 좋아요?</h2>
  <div id="dateList" data-reveal></div>

  <div class="field" data-reveal>
    <label>이름은?</label>
    <input type="text" id="nameInput" placeholder="이름을 입력해주세요" maxlength="20">
  </div>
  <button class="submit-btn" id="submitBtn" disabled data-reveal>체크인 <span class="arrow">→</span></button>
  <div class="hint" id="btnHint">날짜와 이름을 모두 입력하면 활성화돼요</div>
  <div class="status" id="statusMsg"></div>

  <h2 data-reveal>먼저 체크인한<br>사람들</h2>
  <div id="manifestList" data-reveal><div class="empty">님만 오면 출발</div></div>
</div>

<script type="module">
  const CANDIDATES = [
    { id:1, no:"01", start:"2026-10-02", end:"2026-10-04" },
    { id:2, no:"02", start:"2026-10-03", end:"2026-10-05" },
    { id:3, no:"03", start:"2026-10-04", end:"2026-10-06" },
    { id:4, no:"04", start:"2026-10-08", end:"2026-10-10" },
  ];
  const DOW = ["일","월","화","수","목","금","토"];
  function fmtRange(s,e){ const a=new Date(s), b=new Date(e); return `${a.getMonth()+1}/${a.getDate()} - ${b.getMonth()+1}/${b.getDate()}`; }
  function fmtDow(s,e){ const a=new Date(s), b=new Date(e); return `${DOW[a.getDay()]}-${DOW[b.getDay()]} · 2박 3일`; }

  let selectedId = null;
  const dateList = document.getElementById("dateList");
  function renderList(){
    dateList.innerHTML = "";
    CANDIDATES.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "date-big" + (selectedId===c.id ? " selected" : "");
      btn.innerHTML = `<div class="range">${fmtRange(c.start,c.end)}</div><div class="days">${fmtDow(c.start,c.end)}</div>`;
      btn.addEventListener("click", () => { selectedId=c.id; renderList(); updateSubmitState(); });
      dateList.appendChild(btn);
    });
  }
  renderList();

  const nameInput = document.getElementById("nameInput");
  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");
  const btnHint = document.getElementById("btnHint");
  function updateSubmitState(){
    const ready = !!(selectedId && nameInput.value.trim().length>0);
    submitBtn.disabled = !ready;
    btnHint.style.display = ready ? "none" : "block";
  }
  nameInput.addEventListener("input", updateSubmitState);
  updateSubmitState();

  let db=null, fb=null, dbReady=false;
  const manifestList = document.getElementById("manifestList");
  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
  function renderManifest(docs){
    if(!docs.length){ manifestList.innerHTML = `<div class="empty">님만 오면 출발</div>`; return; }
    manifestList.innerHTML = "";
    docs.forEach(d => {
      const row = document.createElement("div");
      row.className = "m-row";
      row.innerHTML = `<span class="n">${escapeHtml(d.name||"")}</span><span class="d">${escapeHtml(d.dateChoice||"")}</span>`;
      manifestList.appendChild(row);
    });
  }

  submitBtn.addEventListener("click", async () => {
    const c = CANDIDATES.find(x=>x.id===selectedId);
    if(!c) return;
    if(!dbReady || !fb){ statusMsg.textContent="저장 기능이 꺼져 있어요."; statusMsg.className="status err"; return; }
    submitBtn.disabled = true;
    statusMsg.textContent = "저장 중...";
    statusMsg.className = "status";
    try{
      await fb.addDoc(fb.collection(db,"responses"), {
        name: nameInput.value.trim(), dateChoice: fmtRange(c.start,c.end), flightNo:c.no, submittedAt: fb.serverTimestamp()
      });
      statusMsg.textContent = "체크인이 완료됐어요!";
      statusMsg.className = "status ok";
      nameInput.value=""; selectedId=null; renderList();
    }catch(e){
      console.error(e);
      statusMsg.textContent = "저장에 실패했어요.";
      statusMsg.className = "status err";
    } finally { updateSubmitState(); }
  });

  async function connectFirebase(){
    const warning = document.getElementById("configWarning");
    const firebaseConfig = {
      apiKey:"여기에_API_KEY", authDomain:"여기에_PROJECT_ID.firebaseapp.com",
      projectId:"여기에_PROJECT_ID", storageBucket:"여기에_PROJECT_ID.appspot.com",
      messagingSenderId:"여기에_SENDER_ID", appId:"여기에_APP_ID"
    };
    const isConfigured = !Object.values(firebaseConfig).some(v => String(v).includes("여기에"));
    if(!isConfigured){ warning.style.display="block"; return; }
    try{
      const [{initializeApp}, fs] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      ]);
      const app = initializeApp(firebaseConfig);
      db = fs.getFirestore(app);
      fb = { collection: fs.collection, addDoc: fs.addDoc, serverTimestamp: fs.serverTimestamp };
      dbReady = true;
      const q = fs.query(fs.collection(db,"responses"), fs.orderBy("submittedAt","asc"));
      fs.onSnapshot(q, snap => renderManifest(snap.docs.map(d=>d.data())));
    }catch(e){
      console.error("Firebase 연결 실패:", e);
      warning.textContent = "Firebase에 연결하지 못했어요. 화면은 정상 동작해요.";
      warning.style.display = "block";
    }
  }
  connectFirebase();

  // 스크롤 리빌
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) en.target.classList.add("in"); });
  }, { threshold: 0.15 });
  document.querySelectorAll("[data-reveal]").forEach(el => io.observe(el));
</script>
</body>
</html>
