<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>떠나요 둘이서 · 제주 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e17;
    --bg-deep: #060811;
    --envelope: #2c2416;
    --envelope-edge: #1b160d;
    --card: #221b12;
    --card-edge: #3a2f1c;
    --cream: #f3eee2;
    --muted: #9b9484;
    --accent: #e2884f;
    --accent-dim: rgba(226,136,79,0.18);
    --line: #55492f;
    --lavender: #b9a3d8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 60% 10%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 80% 30%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 45% 70%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 90% 65%, rgba(255,255,255,.45), transparent),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,.3), transparent),
      linear-gradient(180deg, var(--bg-deep), var(--bg) 40%, var(--bg));
    background-attachment: fixed;
    color: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px; margin:0 auto; padding:56px 24px 40px;}
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(28px,7vw,38px);
    line-height:1.35;
    text-align:center;
    margin:0 0 18px;
  }
  h1 .accent{color:var(--accent); font-size:0.667em; display:inline-block; margin-top:6px;}

  .hero{ position:relative; }
  .hero-plane{
    position:absolute;
    left:0; top:130px;
    color: var(--lavender);
    opacity:.65;
    animation: planeFloat 20s linear infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes planeFloat{
    0%   { transform: translate(0,0) rotate(-6deg); }                                    /* 출발: 우상향 */
    46%  { transform: translate(calc(100vw - 46px), -110px) rotate(8deg); }               /* 도착: 계속 우상향 */
    52%  { transform: translate(calc(100vw - 46px), -110px) rotate(188deg); }             /* 방향 전환: 아래로 */
    96%  { transform: translate(0,0) rotate(196deg); }                                    /* 복귀: 계속 아래 방향 */
    100% { transform: translate(0,0) rotate(354deg); }                                    /* 다시 방향 전환: 다음 루프로 자연스럽게 이어짐 */
  }
  @media (prefers-reduced-motion: reduce){
    .hero-plane{ animation: none; }
  }

  /* envelope */
  .envelope-stage{margin:0 auto 8px; max-width:420px;}

  .stay-photo{
    position:relative; border-radius:16px; overflow:hidden;
    aspect-ratio:2/3; background:var(--envelope);
    border:1px solid var(--envelope-edge);
  }
  .stay-photo-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:center; padding:20px;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 10px, transparent 10px 20px);
  }
  .stay-photo-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .stay-photo-overlay{
    position:absolute; left:0; right:0; bottom:0; padding:20px 22px 18px;
    background: linear-gradient(to top, rgba(10,14,23,.92) 20%, rgba(10,14,23,.25) 75%, transparent);
  }
  .stay-photo-title{
    font-family:'Noto Serif KR',serif; font-weight:700; font-size:20px;
    color:var(--cream);
  }

  .foot{ text-align:center; color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-top:44px; letter-spacing:.05em; }
</style>
</head>
<body>

<svg class="hero-plane" aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 3L3 10.5L11 13.5L14 21L21 3Z"/>
  <path d="M21 3L11 13.5"/>
</svg>

<div class="wrap">
  <div class="hero">
    <h1>놀멍, 쉬멍<br><span class="accent">우리 함께</span></h1>
  </div>

  <div class="envelope-stage" id="envelopeStage">
    <div class="stay-photo">
      <img src="assets/jejuhomeimg.png" alt="Y리조트 제주 소개 이미지" class="stay-photo-img">
      <div class="stay-photo-overlay">
        <div class="stay-photo-title">2026.10.04~10.06</div>
      </div>
    </div>
  </div>

  <div class="foot">v0.4 · 축! 숙소 결정</div>
</div>
</body>
</html>
