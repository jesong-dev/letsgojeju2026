<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>떠나요 둘이서 · 제주 2026 — Pastel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fbf3f8; --bg2:#f2f0fb;
    --ink:#3b3542; --muted:#9c93a6;
    --card:#ffffff; --coral:#f0917a; --coral-soft:#fde3dc;
    --lav:#c9b6e4; --lav-soft:#efe7f9;
    --sun:#f0917a; --sat:#8fb3d9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink); font-family:'Noto Sans KR',sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg2), transparent 55%),
                radial-gradient(circle at 90% 20%, var(--bg1), transparent 50%),
                #fffaf9;
    min-height:100vh;
  }
  .wrap{max-width:480px; margin:0 auto; padding:48px 20px 50px;}
  .eyebrow{ font-size:13px; color:var(--muted); text-align:center; margin-bottom:10px; font-weight:500; }
  h1{
    font-family:'Jua',sans-serif; font-weight:400;
    font-size:clamp(28px,8vw,36px); text-align:center; line-height:1.45; margin:0 0 14px; color:#4a3f55;
  }
  h1 .hl{ color:var(--coral); }
  .lede{ text-align:center; color:var(--muted); font-size:14px; line-height:1.7; max-width:300px; margin:0 auto 30px; }

  .reveal-card{
    background:var(--card); border-radius:28px; padding:30px 22px; text-align:center;
    box-shadow:0 14px 30px -12px rgba(150,120,170,.35);
    cursor:pointer; transition: transform .25s ease;
  }
  .reveal-card:active{ transform:scale(.97); }
  .reveal-emoji{ font-size:34px; margin-bottom:10px; }
  .reveal-title{ font-family:'Jua',sans-serif; font-size:19px; color:#4a3f55; margin-bottom:6px; }
  .reveal-sub{ font-size:12.5px; color:var(--muted); }

  .content{ max-height:0; overflow:hidden; transition:max-height .7s ease; }
  .content.show{ max-height:2600px; }
  .card{
    background:var(--card); border-radius:24px; padding:24px 20px; margin-top:16px;
    box-shadow:0 10px 24px -14px rgba(150,120,170,.3);
  }
  .card h2{ font-family:'Jua',sans-serif; font-weight:400; font-size:19px; margin:0 0 6px; color:#4a3f55; }
  .card p.sub{ color:var(--muted); font-size:13px; margin:0 0 16px; line-height:1.6; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background:var(--lav-soft); color:#5c4f72; border-radius:16px; padding:12px 14px;
    font-size:13.5px; font-weight:500; cursor:pointer; flex:1 1 44%; text-align:center;
    border:2px solid transparent; transition:.15s ease;
  }
  .chip .days{ display:block; font-size:10.5px; color:var(--muted); margin-top:3px; font-weight:400; }
  .chip.selected{ background:var(--coral); color:#fff; border-color:var(--coral); }
  .chip.selected .days{ color:rgba(255,255,255,.85); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:16px; text-align:center; }
  .cal-dow{ font-size:10.5px; color:var(--muted); padding-bottom:2px; }
  .cal-day{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:9px; font-size:12px; color:var(--muted); }
  .cal-day.empty{ visibility:hidden; }
  .cal-day.candidate{ background:var(--lav-soft); color:#5c4f72; }
  .cal-day.sun{ color:var(--sun); } .cal-day.sat{ color:var(--sat); }
  .cal-day.holiday{ font-weight:700; }
  .cal-day.active{ background:var(--coral); color:#fff; font-weight:700; }

  .field{ margin-top:18px; }
  .field label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px; font-weight:500; }
  .field input{
    width:100%; border:1.5px solid var(--lav-soft); border-radius:14px; padding:12px 14px;
    font-size:14.5px; outline:none; font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  }
  .field input:focus{ border-color:var(--coral); }
  .submit-btn{
    width:100%; margin-top:14px; padding:14px; border:none; border-radius:18px;
    background:var(--coral); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .submit-btn:disabled{ background:#e8e2ee; color:var(--muted); cursor:not-allowed; }
  .hint{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:8px; }
  .status{ font-size:12.5px; margin-top:8px; text-align:center; min-height:16px; }
  .status.ok{ color:#5b9e78; } .status.err{ color:#d97757; }

  .avatar-row{ display:flex; align-items:center; gap:10px; padding:9px 0; }
  .avatar{
    width:30px; height:30px; border-radius:50%; background:var(--lav);
    color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:14px 0; }
  .warn{ font-size:11.5px; color:#a4573f; background:var(--coral-soft); padding:10px 14px; border-radius:12px; margin-bottom:16px; display:none; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="warn" id="configWarning">Firebase 설정이 비어 있어요. 화면 확인은 되지만 저장은 안 돼요.</div>

  <div class="eyebrow">떠나요 · 둘이서 · 2026</div>
  <h1>일상은 잠시<br>접어두고, <span class="hl">제주로</span> 🌊</h1>
  <p class="lede">봉투를 톡 눌러보세요. 당신을 위한 탑승권이 들어있어요.</p>

  <div class="reveal-card" id="revealCard">
    <div class="reveal-emoji">✈️</div>
    <div class="reveal-title">SEL → CJU</div>
    <div class="reveal-sub">눌러서 초대장 열어보기</div>
  </div>

  <div class="content" id="content">
    <div class="card">
      <h2>느긋하게, 즐겁게!</h2>
      <p class="sub">이 초대장을 받으신 분께는 앞으로 몇 번 정도 질문을 드릴 예정이에요. 부담 갖지 마시고 편하게 답해주시면 돼요 😊</p>
    </div>

    <div class="card">
      <h2>2박 3일, 언제가 좋아요?</h2>
      <p class="sub">후보 중 하나를 골라주세요.</p>
      <div class="chip-row" id="chipRow"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="card">
      <div class="field">
        <label>이름</label>
        <input type="text" id="nameInput" placeholder="이름을 입력해주세요" maxlength="20">
      </div>
      <button class="submit-btn" id="submitBtn" disabled>체크인 완료 🎫</button>
      <div class="hint" id="btnHint">날짜와 이름을 모두 입력하면 활성화돼요</div>
      <div class="status" id="statusMsg"></div>
    </div>

    <div class="card">
      <h2>먼저 체크인한 사람들</h2>
      <div id="manifestList"><div class="empty">님만 오면 출발 🚀</div></div>
    </div>
  </div>
</div>

<script type="module">
  const CANDIDATES = [
    { id:1, no:"01", start:"2026-10-02", end:"2026-10-04" },
    { id:2, no:"02", start:"2026-10-03", end:"2026-10-05" },
    { id:3, no:"03", start:"2026-10-04", end:"2026-10-06" },
    { id:4, no:"04", start:"2026-10-08", end:"2026-10-10" },
  ];
  const DOW = ["일","월","화","수","목","금","토"];
  const HOLIDAYS = new Set(["2026-10-03","2026-10-05","2026-10-09"]);
  function fmtRange(s,e){ const a=new Date(s), b=new Date(e); return `${a.getMonth()+1}/${a.getDate()}-${b.getMonth()+1}/${b.getDate()}`; }
  function fmtDow(s,e){ const a=new Date(s), b=new Date(e); return `${DOW[a.getDay()]}-${DOW[b.getDay()]} · 2박3일`; }
  function datesInRange(s,e){ const out=[]; let cur=new Date(s); const end=new Date(e); while(cur<=end){ out.push(cur.toISOString().slice(0,10)); cur=new Date(cur.getTime()+86400000);} return out; }

  let selectedId = null;
  const chipRow = document.getElementById("chipRow");
  function renderChips(){
    chipRow.innerHTML = "";
    CANDIDATES.forEach(c => {
      const el = document.createElement("div");
      el.className = "chip" + (selectedId===c.id ? " selected" : "");
      el.innerHTML = `${fmtRange(c.start,c.end)}<span class="days">${fmtDow(c.start,c.end)}</span>`;
      el.addEventListener("click", () => { selectedId=c.id; renderChips(); renderCalendar(); updateSubmitState(); });
      chipRow.appendChild(el);
    });
  }

  const calGrid = document.getElementById("calGrid");
  function renderCalendar(){
    calGrid.innerHTML = "";
    DOW.forEach((d,i) => { const el=document.createElement("div"); el.className="cal-dow"+(i===0?" sun":i===6?" sat":""); el.textContent=d; calGrid.appendChild(el); });
    const year=2026, month=9;
    const firstDay = new Date(year,month,1).getDay();
    const daysInMonth = new Date(year,month+1,0).getDate();
    const allCand = new Set(CANDIDATES.flatMap(c=>datesInRange(c.start,c.end)));
    const sel = CANDIDATES.find(c=>c.id===selectedId);
    const active = sel ? new Set(datesInRange(sel.start,sel.end)) : new Set();
    for(let i=0;i<firstDay;i++){ const el=document.createElement("div"); el.className="cal-day empty"; calGrid.appendChild(el); }
    for(let d=1; d<=daysInMonth; d++){
      const iso = `${year}-10-${String(d).padStart(2,"0")}`;
      const dow = new Date(year,month,d).getDay();
      const el = document.createElement("div");
      let cls="cal-day";
      if(dow===0) cls+=" sun"; if(dow===6) cls+=" sat";
      if(HOLIDAYS.has(iso)) cls+=" holiday";
      if(allCand.has(iso)) cls+=" candidate";
      if(active.has(iso)) cls+=" active";
      el.className=cls; el.textContent=d;
      calGrid.appendChild(el);
    }
  }

  renderChips(); renderCalendar();

  const revealCard = document.getElementById("revealCard");
  const content = document.getElementById("content");
  revealCard.addEventListener("click", () => {
    content.classList.toggle("show");
    revealCard.style.transform = "scale(.96)";
    setTimeout(()=> revealCard.style.transform = "", 150);
  });

  const nameInput = document.getElementById("nameInput");
  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");
  const btnHint = document.getElementById("btnHint");
  function updateSubmitState(){
    const ready = !!(selectedId && nameInput.value.trim().length>0);
    submitBtn.disabled = !ready;
    btnHint.style.display = ready ? "none" : "block";
  }
  nameInput.addEventListener("input", updateSubmitState);
  updateSubmitState();

  let db=null, fb=null, dbReady=false;
  const manifestList = document.getElementById("manifestList");
  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
  function renderManifest(docs){
    if(!docs.length){ manifestList.innerHTML = `<div class="empty">님만 오면 출발 🚀</div>`; return; }
    manifestList.innerHTML = "";
    docs.forEach(d => {
      const row = document.createElement("div");
      row.className = "avatar-row";
      const initial = (d.name||"?").trim().charAt(0);
      row.innerHTML = `<div class="avatar">${escapeHtml(initial)}</div><div><div>${escapeHtml(d.name||"")}</div><div style="font-size:11px;color:var(--muted);">${escapeHtml(d.dateChoice||"")}</div></div>`;
      manifestList.appendChild(row);
    });
  }

  submitBtn.addEventListener("click", async () => {
    const c = CANDIDATES.find(x=>x.id===selectedId);
    if(!c) return;
    if(!dbReady || !fb){ statusMsg.textContent="저장 기능이 꺼져 있어요."; statusMsg.className="status err"; return; }
    submitBtn.disabled = true;
    statusMsg.textContent = "저장 중...";
    statusMsg.className = "status";
    try{
      await fb.addDoc(fb.collection(db,"responses"), {
        name: nameInput.value.trim(), dateChoice: fmtRange(c.start,c.end), flightNo:c.no, submittedAt: fb.serverTimestamp()
      });
      statusMsg.textContent = "체크인 완료! 🎉";
      statusMsg.className = "status ok";
      nameInput.value=""; selectedId=null; renderChips(); renderCalendar();
    }catch(e){
      console.error(e);
      statusMsg.textContent = "저장에 실패했어요.";
      statusMsg.className = "status err";
    } finally { updateSubmitState(); }
  });

  async function connectFirebase(){
    const warning = document.getElementById("configWarning");
    const firebaseConfig = {
      apiKey:"여기에_API_KEY", authDomain:"여기에_PROJECT_ID.firebaseapp.com",
      projectId:"여기에_PROJECT_ID", storageBucket:"여기에_PROJECT_ID.appspot.com",
      messagingSenderId:"여기에_SENDER_ID", appId:"여기에_APP_ID"
    };
    const isConfigured = !Object.values(firebaseConfig).some(v => String(v).includes("여기에"));
    if(!isConfigured){ warning.style.display="block"; return; }
    try{
      const [{initializeApp}, fs] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      ]);
      const app = initializeApp(firebaseConfig);
      db = fs.getFirestore(app);
      fb = { collection: fs.collection, addDoc: fs.addDoc, serverTimestamp: fs.serverTimestamp };
      dbReady = true;
      const q = fs.query(fs.collection(db,"responses"), fs.orderBy("submittedAt","asc"));
      fs.onSnapshot(q, snap => renderManifest(snap.docs.map(d=>d.data())));
    }catch(e){
      console.error("Firebase 연결 실패:", e);
      warning.textContent = "Firebase에 연결하지 못했어요. 화면은 정상 동작해요.";
      warning.style.display = "block";
    }
  }
  connectFirebase();
</script>
</body>
</html>
